# PaqGateway — Nginx TLS + WebSocket (plantilla TR-003 / N2–N4)
# Copiar a /etc/nginx/conf.d/gateway.conf (Amazon Linux) o sites-available/
# Hostname ops: gateway.paqsystems.com (ver instalacion-exhaustiva-paq-gateway-ia.md)
# Orden recomendado: vhost HTTP → DNS → certbot --nginx (no activar 443 ssl sin cert).
#
# Público: solo /agent-hub (y negotiate SignalR bajo ese path).
# /internal/* NO se publica aquí — Laravel usa http://<IP-privada>:5100 en la VPC.

upstream paqgateway_kestrel {
    server 127.0.0.1:5100;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name gateway.paqsystems.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gateway.paqsystems.com;

    # ssl_certificate     /etc/letsencrypt/live/gateway.paqsystems.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/gateway.paqsystems.com/privkey.pem;

    # Negociate + hub SignalR (path canónico SPEC)
    location /agent-hub {
        proxy_pass http://paqgateway_kestrel;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # No proxyar /internal en el vhost público
    location /internal {
        return 404;
    }

    location / {
        return 404;
    }
}
